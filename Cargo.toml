[package]
name = "nglob"
version = "0.99.0"
edition = "2024"
authors = ["Matthew McAllister <matthew.mcallister.0@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/matthew-mcallister/nglob"
description = "A library for globbing files and strings."

[dependencies]
bitflags = "^2.13.2"
fnv = "^1.0.7"
smallstr = "^0.3.1"
smallvec = "^1.16.0"
tokio = { version = "^1.53.1", features = ["fs", "rt"], optional = true }
tokio-stream = { version = "^0.1.19", features = ["fs"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "^1.53.1", features = ["fs", "rt", "macros"] }
tokio-stream = { version = "^0.1.19", features = ["fs"] }

[features]
tokio = ["dep:tokio", "dep:tokio-stream"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
