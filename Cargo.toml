[package]
name = "nglob"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "^2.13.2"
fnv = "^1.0.7"
smallstr = "^0.3.1"
smallvec = "^1.16.0"
tokio = { version = "^1.53.1", features = ["fs"], optional = true }
tokio-stream = { version = "^0.1.19", features = ["fs"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "^1.53.1", features = ["fs", "rt", "macros"] }
tokio-stream = { version = "^0.1.19", features = ["fs"] }

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:tokio-stream"]
